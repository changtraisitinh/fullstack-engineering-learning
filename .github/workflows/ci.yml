name: Build Java Maven App
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build-maven-app:
    runs-on: ubuntu-latest
    # Set a default working directory for all run steps in this job
    defaults:
      run:
        working-directory: ./devops/ci-cd/github-actions/sample-java-demo-maven
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'  # Adjust to your Java version (8, 11, 17, 21, etc.)
          distribution: 'temurin'  # or 'adopt', 'zulu', 'corretto'
      
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      
      - name: Build with Maven
        run: mvn clean install
      
      - name: Run tests
        run: mvn test