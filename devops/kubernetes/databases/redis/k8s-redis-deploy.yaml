apiVersion: v1
kind: ConfigMap 
metadata:
  name: redis-config
data:
  redis.conf: |
    maxmemory 2mb
    maxmemory-policy allkeys-lru

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels:
      app: redis
  replicas: 1
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis
        command: ["redis-server","/redis-config/redis.conf"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: config
          mountPath: /redis-config       
      volumes:
      - name: config
        configMap: 
          name: redis-config

---

apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
      nodePort: 31379