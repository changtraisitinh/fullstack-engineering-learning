<!DOCTYPE html>
<html>
<head>
    <title>Article Detail</title>
</head>
<body>
    <div id="article-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        async function getArticle(id) {
            const response = await fetch(`http://localhost:1337/api/articles/${id}?populate=*`);
            const data = await response.json();
            return data.data;  // Access the 'data' property
        }

        async function displayArticle() {
            const article = await getArticle(articleId);
            const container = document.getElementById('article-container');

            if (article) {
                container.innerHTML = `
                    <h1>${article.title}</h1>
                    <img src="http://localhost:1337${article.attributes.Cover_Image.data.attributes.url}" alt="Cover Image" style="max-width: 500px;">
                    <p>${article.attributes.Content}</p>
                `;
            } else {
                container.innerHTML = '<p>Article not found.</p>';
            }
        }

        displayArticle();
    </script>
</body>
</html>
