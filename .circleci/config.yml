version: 2.1

executors:
  docker-executor:
    docker:
      - image: circleci/node:14
    working_directory: ~/repo

jobs:
  build:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Change directory to project path
          command: ls
      - run:
          name: Install dependencies
          command: npm install
          working_directory: ~/repo/devops/projects/simple-lab/app
      - run:
          name: Run App
          command: node ./devops/projects/simple-lab/app/server.js
      - run:
          name: Stop App
          command: fuser -k 3000/tcp

workflows:
  version: 2
  build_and_test:
    jobs:
      - build