server:
  port: 8888

spring:
  application:
    name: atg-jwt-service

x-pay-integration:
  atg:
#    issuer: ${ATG_ISSUER} # Replace with the actual 'iss' provided by ATG
#    duration: ${ATG_TOKEN_DURATION} # Duration for which the token is valid
#    token-claim: ${ATG_TOKEN_CLAIM} # The claim that contains the token
#    private-key: ${ATG_TOKEN_PRIVATE_KEY} # Private key for signing the JWT

    issuer: 559e1f93-65b2-11ef-8e67-fa163e85d367 # Replace with the actual 'iss' provided by ATG
    duration: 'PT3H' # Duration for which the token is valid
    token-claim: '' # The claim that contains the token
    private-key:   # Private key for signing the JWT

    # Secrets for Encrypted Card Data (JWE/JWS) - REPLACE WITH ACTUAL ATG SECRETS
    # These should be at least 32 bytes (256 bits) for HS256 and A256GCMKW/A256GCM
    card-data:
      enc-secret: c432ce02a852bc075b40b8dc180ade38cec62fca7063d9c3e1c6bb17694663fd # Example: 32 chars = 32 bytes if ASCII
      sig-secret: 76b0ba1b713ceaaceaf2d8f1105baab977274d770ba2086f77d644ac53d67918 # Example: 32 chars = 32 bytes if ASCII
