server {
    listen 80;
    root /usr/share/nginx/html;

    # Module Federation loads remoteEntry.js and its chunks as ES modules via
    # dynamic import() from a different origin (the shell) — that's a
    # cross-origin module fetch, so it needs CORS headers, not just a script
    # tag src (which browsers don't gate the same way).
    add_header 'Access-Control-Allow-Origin' '*' always;

    # remoteEntry.js keeps a fixed filename across deploys (unlike the content-hashed chunks
    # under /assets/), so without this, browsers can cache a stale copy indefinitely and never
    # see a new deploy.
    location = /remoteEntry.js {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'no-cache' always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
