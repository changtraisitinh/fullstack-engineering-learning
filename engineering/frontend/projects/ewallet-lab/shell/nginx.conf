server {
    listen 80;
    root /usr/share/nginx/html;

    # index.html has a fixed filename (unlike the content-hashed chunks under /assets/), so
    # without this, browsers can cache a stale copy indefinitely and never see a new deploy —
    # same issue as remoteEntry.js on the remotes (see their nginx.conf).
    location = /index.html {
        add_header 'Cache-Control' 'no-cache' always;
    }

    location / {
        try_files $uri /index.html;
    }
}
