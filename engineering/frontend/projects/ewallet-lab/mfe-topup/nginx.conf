server {
    listen 80;
    root /usr/share/nginx/html;

    # See mfe-auth/nginx.conf for why this is needed — same Module Federation
    # cross-origin dynamic import() concern applies to every remote.
    add_header 'Access-Control-Allow-Origin' '*' always;

    # remoteEntry.js keeps a fixed filename across deploys (unlike the content-hashed chunks
    # under /assets/), so without this, browsers can cache a stale copy indefinitely and never
    # see a new deploy.
    location = /remoteEntry.js {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'no-cache' always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
