spring:
  application:
    name: ewallet-lab-investment-fund-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:ewallet_investment}
    username: ${DB_USER:ewallet_investment}
    password: ${DB_PASSWORD:ewallet_investment}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8102

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

ewallet-lab:
  wallet-service:
    base-url: ${WALLET_SERVICE_URL:http://localhost:8091}
  investment:
    nav-update-interval-seconds: 60
    nav-volatility-pct: 0.05
    min-amount: 10000
    max-amount: 100000000

