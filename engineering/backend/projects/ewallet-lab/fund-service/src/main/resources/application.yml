spring:
  application:
    name: ewallet-lab-fund-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ewallet_fund}
    username: ${DB_USER:ewallet_fund}
    password: ${DB_PASSWORD:ewallet_fund}
  jpa:
    # Off on purpose — see loyalty-service's application.yml: with open-in-view, a row read earlier
    # in the HTTP request is handed back stale by the later SELECT ... FOR UPDATE (raw 500s under
    # real Postgres contention).
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8100

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

ewallet-lab:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8090}
  wallet-service:
    base-url: ${WALLET_SERVICE_URL:http://localhost:8091}
  fund:
    # Self-designed MVP cap (no verified source for MoMo's real per-fund member limit).
    max-members: ${FUND_MAX_MEMBERS:50}
