spring:
  application:
    name: ewallet-lab-family-wallet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ewallet_family_wallet}
    username: ${DB_USER:ewallet_family_wallet}
    password: ${DB_PASSWORD:ewallet_family_wallet}
    # Issue #24 — see user-service's application.yml for the full rationale.
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8100

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

ewallet-lab:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8090}
  wallet-service:
    base-url: ${WALLET_SERVICE_URL:http://localhost:8091}
