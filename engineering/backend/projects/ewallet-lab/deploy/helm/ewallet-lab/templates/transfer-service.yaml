apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.transferService.replicas }}
  selector:
    matchLabels: { app: transfer-service }
  template:
    metadata:
      labels: { app: transfer-service }
    spec:
      enableServiceLinks: false
      containers:
        - name: transfer-service
          image: {{ include "ewallet-lab.image" (dict "root" $ "name" "transfer-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.transferService.port }}
          env:
            - name: USER_SERVICE_URL
              value: "http://user-service:{{ .Values.userService.port }}"
            - name: WALLET_SERVICE_URL
              value: "http://wallet-service:{{ .Values.walletService.port }}"
            - name: ALLOWED_ORIGIN_PATTERN
              value: {{ .Values.corsAllowedOriginPattern | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ .Values.transferService.port }} }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ .Values.transferService.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: transfer-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: transfer-service }
  ports:
    - port: {{ .Values.transferService.port }}
      targetPort: {{ .Values.transferService.port }}
