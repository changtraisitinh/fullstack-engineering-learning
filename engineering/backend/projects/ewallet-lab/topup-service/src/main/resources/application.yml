spring:
  application:
    name: ewallet-lab-topup-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ewallet_topup}
    username: ${DB_USER:ewallet_topup}
    password: ${DB_PASSWORD:ewallet_topup}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8092

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

ewallet-lab:
  topics:
    topup-confirmed: wallet.topup.confirmed
  bank-gateway:
    base-url: ${BANK_GATEWAY_URL:http://localhost:8093}
  wallet-service:
    base-url: ${WALLET_SERVICE_URL:http://localhost:8091}
  self:
    base-url: ${SELF_BASE_URL:http://localhost:8092}
