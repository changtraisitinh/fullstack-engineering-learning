version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_hub
      POSTGRES_USER: payment_hub
      POSTGRES_PASSWORD: payment_hub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payment-hub-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Separate Postgres instance for ledger-service — deliberately not the same DB as `postgres`
  # above. Schema/database-per-service, not a shared database across microservices (see
  # DESIGN.md and payment-hub/README.md).
  ledger-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payment-hub-ledger-postgres:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  orchestrator:
    build: ./orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      compliance-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payment_hub
      DB_USER: payment_hub
      DB_PASSWORD: payment_hub
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COMPLIANCE_SERVICE_URL: http://compliance-service:8083

  napas-adapter:
    build: ./napas-adapter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ROUTING_TOPIC: payment.routing.requested
      SETTLEMENT_TOPIC: payment.settlement.confirmed
      HTTP_PORT: "8081"

  swift-adapter:
    build: ./swift-adapter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ROUTING_TOPIC: payment.routing.requested
      SETTLEMENT_TOPIC: payment.settlement.confirmed
      HTTP_PORT: "8082"

  compliance-service:
    build: ./compliance-service
    ports:
      - "8083:8083"
    environment:
      HTTP_PORT: "8083"

  ledger-service:
    build: ./ledger-service
    depends_on:
      ledger-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      DB_HOST: ledger-postgres
      DB_PORT: 5432
      DB_NAME: ledger
      DB_USER: ledger
      DB_PASSWORD: ledger
      KAFKA_BOOTSTRAP: kafka:9092

  visa-adapter:
    build: ./visa-adapter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ROUTING_TOPIC: payment.routing.requested
      SETTLEMENT_TOPIC: payment.settlement.confirmed
      HTTP_PORT: "8085"

  mastercard-adapter:
    build: ./mastercard-adapter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ROUTING_TOPIC: payment.routing.requested
      SETTLEMENT_TOPIC: payment.settlement.confirmed
      HTTP_PORT: "8086"

  momo-adapter:
    build: ./momo-adapter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ROUTING_TOPIC: payment.routing.requested
      SETTLEMENT_TOPIC: payment.settlement.confirmed
      HTTP_PORT: "8087"

  zalopay-adapter:
    build: ./zalopay-adapter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ROUTING_TOPIC: payment.routing.requested
      SETTLEMENT_TOPIC: payment.settlement.confirmed
      HTTP_PORT: "8088"

volumes:
  payment-hub-postgres:
  payment-hub-ledger-postgres:
