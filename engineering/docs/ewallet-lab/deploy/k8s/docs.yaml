# Plain kubectl manifests, not a Helm chart — this is one static site, not a multi-service
# product like ewallet-lab itself (see deploy/helm/ewallet-lab/ under backend/projects/ewallet-lab
# for that pattern). Deployed to its own namespace so its lifecycle is independent of the app
# release: `kubectl delete -f docs.yaml` never touches the ewallet-lab namespace or vice versa.
apiVersion: v1
kind: Namespace
metadata:
  name: ewallet-lab-docs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: ewallet-lab-docs
spec:
  replicas: 1
  selector:
    matchLabels: { app: docs }
  template:
    metadata:
      labels: { app: docs }
    spec:
      # Same fix as the main app's Helm chart — see its templates/*.yaml for why this matters
      # (Kubernetes' legacy Docker-links-style env injection can collide with an app's own env
      # vars). No Kafka-named Service exists in this namespace to actually trigger that bug, but
      # it costs nothing to disable consistently.
      enableServiceLinks: false
      containers:
        - name: docs
          image: ewallet-lab/docs:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: ewallet-lab-docs
spec:
  selector: { app: docs }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  namespace: ewallet-lab-docs
spec:
  ingressClassName: nginx
  rules:
    - host: docs.ewallet-lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: docs, port: { number: 80 } }
