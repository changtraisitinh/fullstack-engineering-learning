# No SPA history-API fallback needed — App.tsx routes entirely by URL hash (#page-id), which
# never leaves the browser, so every real request the server sees is just for a static asset.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Fixed-name entry point (index.html) must never be cached by the browser — a stale cached
    # copy is indistinguishable from "deploy had no effect" (same class of bug as remoteEntry.js
    # in the main app's frontend, see frontend CLAUDE.md). Hashed JS/CSS assets under /assets/ are
    # safe to cache long-term since their filename changes on every content change.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
